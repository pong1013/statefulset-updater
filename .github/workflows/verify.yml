name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip check
      - name: Audit runtime dependencies
        run: |
          python -m venv /tmp/dependency-auditor
          /tmp/dependency-auditor/bin/pip install pip-audit==2.10.1
          /tmp/dependency-auditor/bin/pip-audit -r requirements.txt --no-deps --disable-pip
      - uses: azure/setup-helm@v5.0.0
        with:
          version: v3.18.4
      - name: Check Python syntax
        run: python3 -m py_compile webhook/webhook_server.py main-resize-operator/resize_sts_operator.py auto-resize-operator/auto.py
      - name: Run behavior tests
        run: python3 -m unittest discover -s tests -v
      - name: Lint Helm charts
        run: |
          helm lint main-resize-operator/chart --set image.repository=example/operator
          helm lint auto-resize-operator/auto-resize --set image.repository=example/operator
          helm lint webhook/rso-webhook-server \
            --set image.repository=example/webhook \
            --set tls.existingSecret=rotated-webhook-tls \
            --set tls.caBundle=Y2E=
